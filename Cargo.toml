[package]
name = "repeater"
version = "0.1.0"
edition = "2021"
authors = [
  "Pit Kleyersburg <pit.kleyersburg@takkt.com>",
  "TAKKT Industrial & Packaging GmbH <webshop-devops@kaiserkraft-europa.de>"
]
license = "Apache-2.0"
description = "Command-line tool to parse and then repeat GET-requests of an access-log against a different host"

[[bin]]
name = "r7"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.48", features = ["derive", "cargo", "wrap_help"] }
csv = "1.3.1"
hifitime = "4.2.1"
indicatif = { version = "0.18.0", features = ["tokio"] }
reqwest = { version = "0.12.23", features = ["gzip"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.47.1", features = ["full", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
